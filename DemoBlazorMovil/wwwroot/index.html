    <script>
        window.bootstrapModal = {
            show: (id) => {
                const modal = new bootstrap.Modal(document.querySelector(id));
                modal.show();
            },
            hide: (id) => {
                const modalEl = document.querySelector(id);
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
            }
        };
    </script>
